<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Godot + Blender = ❤️</title>
  </head>
  <body class="bg-white text-slate-800" x-data="docs">
    <div class="flex min-h-screen">
      <aside
        class="fixed inset-y-0 left-0 z-10 w-64 -translate-x-full overflow-y-auto border-r border-slate-200 bg-slate-50 p-4 transition-transform md:translate-x-0"
        :class="{ 'translate-x-0': menuOpen }"
      >
        <div class="mb-4 flex items-center justify-between">
          <a href="#/" class="text-lg font-bold hover:underline" @click="menuOpen = false">Godot + Blender = ❤️</a>
          <button class="rounded p-1.5 text-slate-500 hover:bg-slate-200" title="Search" aria-label="Search" @click="openSearch()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
          </button>
        </div>
        <template x-for="cat in menu" :key="cat.label">
          <div class="mb-3">
            <button
              class="flex w-full items-center justify-between text-left text-xs font-semibold uppercase tracking-wide text-slate-500"
              @click="toggle(cat.label)"
            >
              <span x-text="cat.label"></span>
              <span x-text="openCats.includes(cat.label) ? '−' : '+'"></span>
            </button>
            <ul class="mt-1" x-show="openCats.includes(cat.label)">
              <template x-for="(item, i) in cat.items" :key="i">
                <li>
                  <template x-if="item.separator !== undefined">
                    <div class="mb-1 mt-3 border-t border-slate-200 px-2 pt-2 text-[11px] uppercase text-slate-400" x-text="item.separator"></div>
                  </template>
                  <template x-if="item.page">
                    <a
                      :href="'#/' + item.page"
                      class="block rounded px-2 py-1 text-sm hover:bg-slate-200"
                      :class="{ 'bg-slate-200 font-semibold': item.page === current }"
                      @click="menuOpen = false"
                      x-text="item.label"
                    ></a>
                  </template>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </aside>

      <main class="flex-1 md:ml-64">
        <button class="m-3 rounded border px-2 py-1 text-sm md:hidden" @click="menuOpen = !menuOpen">Menu</button>
        <article class="md-content mx-auto max-w-3xl px-6 py-8">
          <p x-show="cat" class="text-xs font-semibold uppercase tracking-wide text-slate-500" x-text="cat"></p>
          <div x-html="html"></div>
        </article>
      </main>
    </div>

    <div
      x-show="searchOpen"
      x-cloak
      class="fixed inset-0 z-20 flex items-start justify-center bg-black/40 p-4 pt-[10vh]"
      @click.self="closeSearch()"
      @keydown.escape.window="closeSearch()"
    >
      <div class="w-full max-w-xl overflow-hidden rounded-lg bg-white shadow-xl">
        <input
          x-ref="searchInput"
          x-model="query"
          @input="runSearch()"
          @keydown.down.prevent="move(1)"
          @keydown.up.prevent="move(-1)"
          @keydown.enter.prevent="results[active] && go(results[active].page)"
          type="search"
          placeholder="Search in pages…"
          class="w-full px-4 py-3 outline-none"
        />
        <div x-show="searchLoading || query.trim().length >= 2" class="max-h-[60vh] overflow-y-auto border-t border-slate-200">
          <p x-show="searchLoading" class="px-4 py-3 text-sm text-slate-500">Loading…</p>
          <p x-show="!searchLoading && query.trim().length >= 2 && !results.length" class="px-4 py-3 text-sm text-slate-500">No results</p>
          <template x-for="(r, i) in results" :key="r.page">
            <a
              :href="'#/' + r.page"
              @click.prevent="go(r.page)"
              @mousemove="active = i"
              class="block border-b border-slate-100 px-4 py-2"
              :class="{ 'bg-slate-100': i === active }"
              :data-active="i === active"
            >
              <div class="text-sm font-semibold" x-text="r.label"></div>
              <div class="text-xs text-slate-400" x-text="r.category + ' › ' + r.label"></div>
              <div class="mt-1 text-sm text-slate-600">
                <span x-text="r.before"></span><mark class="bg-yellow-200" x-text="r.match"></mark><span x-text="r.after"></span>
              </div>
            </a>
          </template>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
